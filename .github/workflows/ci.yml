name: TBoat CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/src/main/**'
      - 'pom.xml'
      - 'common/**'
      - 'server/**'
      - 'client/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/src/main/**'
      - 'pom.xml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456789
          MYSQL_DATABASE: auction_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -p123456789" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Initialize Database Schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -p123456789 auction_db < server/src/main/resources/auction_database.sql

      - name: Enforcement - No System.out.println
        run: |
          if grep -rn "System\.out\.print" . --include=\*.java --exclude-dir=test; then
            echo "❌ LỖI: Cấm dùng System.out.print. Hãy dùng Logger!" && exit 1
          fi
          
          if grep -rn "printStackTrace()" . --include=\*.java --exclude-dir=test; then
            echo "❌ LỖI: Cấm dùng e.printStackTrace(). Hãy dùng log.error(\"Mô tả\", e)!" && exit 1
          fi

      - name: Maven Build and Verify
        run: mvn -f $GITHUB_WORKSPACE/pom.xml clean verify