name: TBoat CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/src/main/**'
      - 'pom.xml'
      - 'common/**'
      - 'server/**'
      - 'client/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/src/main/**'
      - 'pom.xml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Enforcement - No System.out.println
        run: |
          # 1. Chặn System.out.println
          if grep -rn "System\.out\.print" . --include=\*.java --exclude-dir=test; then
            echo "❌ LỖI: Cấm dùng System.out.print. Hãy dùng Logger!" && exit 1
          fi
          
          # 2. Chặn e.printStackTrace()
          if grep -rn "printStackTrace()" . --include=\*.java --exclude-dir=test; then
            echo "❌ LỖI: Cấm dùng e.printStackTrace(). Hãy dùng log.error(\"Mô tả\", e)!" && exit 1
          fi
          
          # 3. Chặn import dấu sao (wildcard)
          if grep -rn "import .*\.\*;" . --include=\*.java; then
            echo "❌ LỖI: Không được import bằng dấu * (VD: java.util.*). Hãy import cụ thể từng class!" && exit 1
          fi

      - name: Maven Build and Verify
        run: mvn clean verify